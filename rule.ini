custom_proxy_group=vps 节点`select`(69baaa3)

; 国别分组
custom_proxy_group=🇯🇵 日本国家节点`select`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)
custom_proxy_group=🇸🇬 新加坡国家节点`select`(新加坡|坡|狮城|SG|Singapore)
custom_proxy_group=🇺🇸 美国国家节点`select`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)
custom_proxy_group=🇭🇰 香港国家节点`select`(港|HK|hk|Hong Kong|HongKong|hongkong)
custom_proxy_group=🇹🇼 台湾国家节点`select`(台湾|TW|tw|Taiwan|taiwan)
custom_proxy_group=📶 电信节点`select`(电信)

enable_rule_generator=true
overwrite_original_rules=true
